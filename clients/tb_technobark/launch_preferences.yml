# TechnoBark — Launch Preferences
# Used by Claude to launch ads with minimal briefing

# ─── Campaign Selection ───
# Multiple campaigns organized by brand/product:
#   - Halo: multiple Halo campaigns — uploads go to ALL Halo campaigns simultaneously
#   - Bark Box: single campaign — uploads go only to this one
#   - Self-Cleaning Litter Boxes: single campaign — uploads go only to this one
# User will specify which brand/product the creatives are for.
campaigns:
  halo: "all Halo campaigns"  # upload to ALL Halo campaigns at once
  bark_box: "Bark Box campaign"
  self_cleaning_litter_box: "Self-Cleaning Litter Boxes campaign"

# ─── Budget ───
# Only applies when creating a NEW ad set. Otherwise upload to existing ad sets.
default_daily_budget: 100  # USD per ad set

# ─── Audience & Targeting ───
# Default: mirror whatever audiences + exclusions are on the live ad sets.
# IMPORTANT: Pull exact audiences from existing live ad sets in the target campaign.
# (API access currently limited — audiences to be populated when access is restored.)
default_audience_type: match_existing
default_geo_locations:
  countries:
    - US

standard_exclusions: "mirror_live_ad_sets"
# TODO: Populate with exact audience IDs once API ads_management permission is granted.

# ─── Optimization ───
default_optimization_goal: OFFSITE_CONVERSIONS  # Sales
default_conversion_event: PURCHASE
default_billing_event: IMPRESSIONS

# ─── Attribution ───
# IMPORTANT: Always use 7-day click attribution unless told otherwise.
attribution_setting: 7d_click

# ─── Products ───
# One product per campaign type:
products:
  - name: Halo
    campaigns: halo
    note: "Uploads go to ALL Halo campaigns simultaneously"
  - name: Self-Cleaning Litter Box
    campaigns: self_cleaning_litter_box
  - name: Bark Box
    campaigns: bark_box

# ─── Ad Copy Strategy ───
# Default: pull top-performing headline + primary text from the last 30 days.
# Override: user provides specific ad copy.
ad_copy_strategy: top_performing_last_30d

# ─── Creative Handling ───
# User will specify: carousel, single image, flex ads, multi-format.
# Default: single image ads unless told otherwise.
# Most uploads go into existing ad sets; new ad sets only when user says so.
default_creative_type: single_image
default_cta: LEARN_MORE

# ─── Naming Convention ───
# Already defined in fb_ads_config.json:
#   campaign: {date}_{buying_type}_{phase}_{objective}_{geo}
#   adset:    {campaign_name}_{targeting_type}_{audience_label}
#   ad:       {ad_name}

# ─── Client-Specific Notes ───
# TWO FACEBOOK PAGES — use the correct one per product:
#   - Technobark (204427493437265) → for Halo and Bark Box
#   - Technomeow (122101083896001739) → for Self-Cleaning Litter Boxes ONLY
# No Instagram configured (Facebook-only account).
pages:
  technobark:
    id: "204427493437265"
    use_for:
      - halo
      - bark_box
  technomeow:
    id: "122101083896001739"
    use_for:
      - self_cleaning_litter_box
