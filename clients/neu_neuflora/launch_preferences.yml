# NeuFlora — Launch Preferences
# Used by Claude to launch ads with minimal briefing

# ─── Campaign Selection ───
# Currently one campaign: Testing.
# User will say "testing launch" or "testing campaign" — match by naming convention.
# Campaign names follow: {date}_{buying_type}_{phase}_{objective}_{geo}

# ─── Budget ───
default_daily_budget: 100  # USD per ad set

# ─── Audience & Targeting ───
default_audience_type: broad
default_geo_locations:
  countries:
    - US

standard_exclusions:
  - type: custom_audience
    id: "120211808503980549"
    label: "Shopify Audiences - Existing Customers Plus (Neuflora)"
  - type: custom_audience
    id: "120217728297150549"
    label: "Purchase - L180D"
    note: "Pixel-based purchase exclusion, last 180 days"
# Based on the March 2026 ad sets (current standard).
# Older ad sets had legacy MMS exclusions — no longer used.

# ─── Optimization ───
default_optimization_goal: OFFSITE_CONVERSIONS  # Sales
default_conversion_event: PURCHASE
default_billing_event: IMPRESSIONS

# ─── Attribution ───
# IMPORTANT: Always use 7-day click attribution unless told otherwise.
attribution_setting: 7d_click

# ─── Products ───
# NeuFlora has many products. No fixed list — product name is determined from:
#   1. What the user specifies in the brief
#   2. The ad creative itself (product name visible in the image/video)
#   3. The filename of the creative asset
# Use the product name in the ad naming convention.

# ─── Ad Copy Strategy ───
# Default: pull top-performing headline + primary text from the last 30 days.
# Conditions for reuse:
#   - Must NOT mention a specific product name (generic copy only)
#   - Must NOT mention a specific month or time-bound promotion
# Override: user provides headline and/or ad copy alongside the creative assets.
ad_copy_strategy: top_performing_last_30d
ad_copy_scope: generic  # reuse copy as long as it's not product-specific or time-bound

# ─── Creative Handling ───
# User will specify in their brief:
#   - Whether creatives include carousels (launch as carousel)
#   - Whether same image has multiple formats (upload as multi-format / flexible ad)
#   - Default: single image ads unless told otherwise
default_creative_type: single_image
default_cta: SHOP_NOW

# ─── Naming Convention ───
# Already defined in fb_ads_config.json:
#   campaign: {date}_{buying_type}_{phase}_{objective}_{geo}
#   adset:    {campaign_name}_{targeting_type}_{audience_label}
#   ad:       {ad_name}

# ─── Client-Specific Notes ───
# None currently.
