# 12 South — Launch Preferences
# Used by Claude to launch ads with minimal briefing

# ─── Campaign Selection ───
# User will say "upload to testing" or "upload to Flex" etc.
# Match by looking at existing campaigns in the ad account using the naming convention.
# Campaign names follow: {date}_{buying_type}_{phase}_{objective}_{geo}
# The "phase" segment identifies the campaign type (e.g., "Testing", "Flex").

# ─── Budget ───
default_daily_budget: 100  # USD per ad set

# ─── Audience & Targeting ───
default_audience_type: broad
default_geo_locations:
  countries:
    - US

standard_exclusions:
  - type: custom_audience
    label: "Klaviyo All Clients exclusion list"
    note: "Synced from Klaviyo — excludes all existing email subscribers"
  - type: pixel_event
    label: "Purchase 180d"
    note: "Anyone who purchased in the last 180 days (pixel-based)"
  - type: custom_audience
    label: "Shopify customer lists (all 3)"
    note: "Three separate Shopify-synced customer lists — exclude all of them"
# To find exact audience IDs: check any existing ABO ad set's exclusions in the account.

# ─── Optimization ───
default_optimization_goal: OFFSITE_CONVERSIONS  # Sales
default_conversion_event: PURCHASE
default_billing_event: IMPRESSIONS

# ─── Attribution ───
# IMPORTANT: Always use 7-day click attribution unless told otherwise.
attribution_setting: 7d_click

# ─── Products ───
# User will specify which product each ad is for.
# Current active products:
products:
  - name: AirFly
    status: evergreen
  - name: Power Bug
    status: evergreen
  - name: Valet
    status: testing
  - name: Higher-Rise 3
    status: testing
# Sales/collection ads may promote multiple products at once — user will specify.

# ─── Ad Copy Strategy ───
# Default: pull top-performing headline + primary text from the last 30 days
#          for the specific product being advertised.
# Override: user provides headline and/or ad copy alongside the creative assets.
ad_copy_strategy: top_performing_last_30d
ad_copy_scope: per_product  # match copy to the product in the ad

# ─── Creative Handling ───
# User will specify in their brief:
#   - Whether creatives include carousels (launch as carousel)
#   - Whether same image has multiple formats (upload as multi-format / flexible ad)
#   - Default: single image ads unless told otherwise
default_creative_type: single_image
# Flexible ads / multi-format: user will flag when applicable.

# ─── Naming Convention ───
# Already defined in fb_ads_config.json:
#   campaign: {date}_{buying_type}_{phase}_{objective}_{geo}
#   adset:    {campaign_name}_{targeting_type}_{audience_label}
#   ad:       {ad_name}

# ─── Client-Specific Notes ───
# None currently.
