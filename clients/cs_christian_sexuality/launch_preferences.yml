# Christian Sexuality (Raising Kids) — Launch Preferences
# Used by Claude to launch ads with minimal briefing

# ─── Campaign Selection ───
# Testing campaign for new ad sets.
default_campaign_keyword: "MMS_ABO_TESTING"

# ─── Budget ───
default_daily_budget: 200  # USD per ad set

# ─── Audience & Targeting ───
default_audience_type: broad
default_geo_locations:
  countries:
    - US

standard_exclusions:
  - type: custom_audience
    label: "Past purchasers"
    note: "Exclude past purchasers — find exact audience ID from existing ad sets in the account"

# ─── Optimization ───
default_optimization_goal: OFFSITE_CONVERSIONS
default_conversion_event: PURCHASE
default_billing_event: IMPRESSIONS

# ─── Attribution ───
attribution_setting: 7d_click

# ─── Products ───
products:
  - name: Raising Kids
    type: course
    url: "https://christian-sexuality.com/raising-kids/"
    status: active

# ─── Ad Copy Strategy ───
# Default: 3 top-performing primary texts + 3 headlines from last 30 days.
ad_copy_strategy: top_performing_last_30d
ad_copy_count:
  primary_text: 3
  headlines: 3

# ─── Creative Handling ───
default_creative_type: single_image
default_cta: LEARN_MORE

# ─── Client-Specific Notes ───
# - "Raising Kids" is the product name, but the brand is Christian Sexuality
# - Landing page includes fbclid parameter — preserve it when building URLs
# - New ad sets go into the testing campaign (ABO structure)
# - Always exclude past purchasers
