# Rustic Warehouse — Launch Preferences
# Used by Claude to launch ads with minimal briefing

# ─── Campaign Selection ───
# Instagram Followers campaign — traffic objective to drive profile visits.
default_campaign_keyword: "MMS | Traffic | Follow Instagram Prof"

# ─── Ad Set Routing ───
# Ads are routed to different ad sets based on location in the ad name/copy:
#   - Ads with "Prosper" → ad set "Prosper / Instagram Followers"
#   - Ads with "Rockwall" → ad set "Rockwall / Instagram Followers"
# User will provide creatives; route based on which location appears in the ad.
adset_routing:
  - match: "Prosper"
    adset_keyword: "Prosper / Instagram Followers"
  - match: "Rockwall"
    adset_keyword: "Rockwall / Instagram Followers"

# ─── Budget ───
# Budget is set on existing ad sets — no new ad sets created by default.

# ─── Audience & Targeting ───
default_audience_type: broad
default_geo_locations:
  countries:
    - US

# ─── Optimization ───
# Traffic/Instagram Followers objective — NOT sales/conversions.
default_optimization_goal: LINK_CLICKS  # Traffic objective
default_billing_event: IMPRESSIONS

# ─── Attribution ───
attribution_setting: 7d_click

# ─── Products ───
# Two locations, each promoted separately:
products:
  - name: Rustic Warehouse Prosper
    location: Prosper
    status: active
  - name: Rustic Warehouse Rockwall
    location: Rockwall
    status: active

# ─── Ad Copy Strategy ───
# Location-specific copy:
#   - Prosper ads get Prosper copy
#   - Rockwall ads get Rockwall copy
# User provides the copy per location, or we pull from existing ads per location.
ad_copy_strategy: location_specific
ad_copy_scope: per_location

# ─── Creative Handling ───
default_creative_type: single_image
default_cta: VISIT_INSTAGRAM_PROFILE  # "Visit Profile"

# ─── Client-Specific Notes ───
# - This is an Instagram Followers campaign, NOT a sales campaign
# - CTA is "Visit Profile" (drives to Instagram profile)
# - Ads must be routed to the correct ad set based on location (Prosper vs Rockwall)
# - Copy is location-specific — never mix Prosper copy with Rockwall ads or vice versa
